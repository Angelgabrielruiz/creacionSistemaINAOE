<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama de Gantt</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="/config/config.js"></script>
  <script src="/config/config2.js"></script>
<script src="/config/config3.js"></script>
  <script src="/config/config4.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    select {
      padding: 5px;
      margin-bottom: 20px;
    }
    #regresar {
      margin-bottom: 10px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <button id="regresar" onclick="location.href='menu.html'">Regresar</button>
  <h1>Calendario - Diagrama de Gantt</h1>
  <label for="proyecto">Selecciona un proyecto:</label>
  <select id="proyecto"></select>

  <div id="gantt_chart" style="width: 100%; height: 600px;"></div>

  <script>
    // Cargar con idioma español
    google.charts.load("current", { packages: ["gantt"], language: "es" });
    google.charts.setOnLoadCallback(init);

    function init() {
      const selector = document.getElementById("proyecto");

      window.config.proyectos.forEach((p, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = p.nombre;
        selector.appendChild(option);
      });

      selector.addEventListener("change", () => {
        const index = selector.value;
        drawChart(window.config.proyectos[index]);
      });

      const params = new URLSearchParams(window.location.search);
      const index = parseInt(params.get("proyecto"));

      if (!isNaN(index) && window.config.proyectos[index]) {
        selector.value = index;
        drawChart(window.config.proyectos[index]);
      } else {
        selector.value = 0;
        drawChart(window.config.proyectos[0]);
      }
    }

    function drawChart(proyecto) {
      const data = new google.visualization.DataTable();
      data.addColumn("string", "ID");
      data.addColumn("string", "Nombre");
      data.addColumn("string", "Recurso");
      data.addColumn("date", "Inicio");
      data.addColumn("date", "Fin");
      data.addColumn("number", "Duración");
      data.addColumn("number", "Progreso");
      data.addColumn("string", "Dependencias");

      const fechas = proyecto.tareas.map(t => ({
        inicio: new Date(t.fechaInicio),
        fin: new Date(t.fechaFin),
      }));

      const fechaInicioMin = new Date(Math.min(...fechas.map(f => f.inicio)));
      const fechaFinMax = new Date(Math.max(...fechas.map(f => f.fin)));

      data.addRow([
        "PROY-" + proyecto.nombre,
        proyecto.nombre,
        null,
        fechaInicioMin,
        fechaFinMax,
        null,
        proyecto.avance,
        null
      ]);

      proyecto.tareas.forEach((tarea) => {
        data.addRow([
          "T" + tarea.id,
          tarea.nombre,
          tarea.responsable || "",
          new Date(tarea.fechaInicio),
          new Date(tarea.fechaFin),
          null,
          tarea.avance || 0,
          null
        ]);
      });

      const chart = new google.visualization.Gantt(document.getElementById("gantt_chart"));

      const options = {
        height: 400 + proyecto.tareas.length * 30,
        gantt: {
          trackHeight: 30,
          labelStyle: {
            fontName: "sans-serif",
            fontSize: 14,
            color: "#000"
          },
          percentEnabled: true // ✔️ Muestra barra de avance
        }
      };

      chart.draw(data, options);
    }
  </script>
</body>
</html>
